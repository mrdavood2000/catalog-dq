version: "3.9"

# ------------------------------------------------------------------ #
# catalog-dq — PostgreSQL 16 experiment environment                   #
# ------------------------------------------------------------------ #
# Usage (from the catalog-dq directory):
#
#   docker compose up -d            # start PostgreSQL in the background
#   docker compose logs -f          # wait until "database system is ready"
#   python run_experiments.py \
#       --db postgres \
#       --dsn "host=localhost port=5432 dbname=catalog_dq user=catalogdq password=catalogdq" \
#       --dataset-dir datasets \
#       --datasets hospital flights beers rayyan movies_1 \
#       --reps 20 --K 5 --z 2.0 \
#       --out-dir results
#   docker compose down             # stop and remove the container
#
# The PostgreSQL data directory is mounted as a named volume so the DB
# survives container restarts. Remove it with: docker volume rm catalog-dq_pgdata

services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogdq_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB:       catalog_dq
      POSTGRES_USER:     catalogdq
      POSTGRES_PASSWORD: catalogdq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Performance tuning for bulk experiment runs
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=64MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=1GB
        -c default_statistics_target=100
        -c log_min_duration_statement=5000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogdq -d catalog_dq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
